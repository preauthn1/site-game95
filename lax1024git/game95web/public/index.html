<!DOCTYPE html>
<html lang="pt">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no, viewport-fit=cover">
	<link rel="icon" href="<%= BASE_URL %><%= VUE_APP_FAVICON %>">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="#0d131c">
	<link rel="apple-touch-icon-precomposed" href="<%= VUE_APP_APPLE_ICON %>">
	<link href="<%= VUE_APP_APPLE_ICON %>" rel="apple-touch-icon">
	<meta name="theme-color" content="#161f2c">
	<meta name="format-detection" content="telephone=no">
	<title>
		<%= VUE_APP_SITE_TITLE %>
	</title>
	<style>
		body {
			margin: 0;
			padding: 0;
		}

		#firstScreenPage {
			width: 100vw;
			height: 100vh;
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 999;
			text-align: center;
			background-color:#0d131c;
		}
		.circular{
			position: absolute;
			animation: firstScreenPageAnimate 2s infinite;
			--time-difference:0.09s;
			--radius:-40px;
		}
		@keyframes firstScreenPageAnimate {
			100%{
				transform: rotate(360deg) scale(1.2,1);
			}
		}
		.circular::after{
			content: "";
			display: block;
			width: 15px;
			height: 15px;
			background: #db1de7;
			border-radius: 50%;
		}
		.circular:nth-child(1){
			animation-delay: calc(var(--time-difference) * 1);
		}
		.circular:nth-child(2){
			animation-delay: calc(var(--time-difference) * 2);
		}
		.circular:nth-child(3){
			animation-delay: calc(var(--time-difference) * 3);
		}
		.circular:nth-child(4){
			animation-delay: calc(var(--time-difference) * 4);
		}
		.circular:nth-child(5){
			animation-delay: calc(var(--time-difference) * 5);
		}
		.circular:nth-child(6){
			animation-delay: calc(var(--time-difference) * 6);
		}
		.circular:nth-child(7){
			animation-delay: calc(var(--time-difference) * 7);
		}
		.circular:nth-child(1)::after{
			transform:translateY(var(--radius)) scale(1);
		}
		.circular:nth-child(2)::after{
			transform:translateY(var(--radius)) scale(.9);
		}
		.circular:nth-child(3)::after{
			transform:translateY(var(--radius)) scale(.8);
		}
		.circular:nth-child(4)::after{
			transform:translateY(var(--radius)) scale(.7);
		}
		.circular:nth-child(5)::after{
			transform:translateY(var(--radius)) scale(.6);
		}
		.circular:nth-child(6)::after{
			transform:translateY(var(--radius)) scale(.5);
		}
		.circular:nth-child(7)::after{
			transform:translateY(var(--radius)) scale(.4);
		}
	</style>
</head>

<body>
	<noscript>
		<strong>We're sorry but Raccoonbet doesn't work properly without JavaScript
			enabled. Please enable it to continue.</strong>
	</noscript>
	<!-- Vue渲染完成之后 会自动初始化这个 APP 标签 -->
	<div id="app">
		<div id="firstScreenPage">
			<div class="circular"></div>
			<div class="circular"></div>
			<div class="circular"></div>
			<div class="circular"></div>
			<div class="circular"></div>
			<div class="circular"></div>
			<div class="circular"></div>
		</div>
	</div>
	

	<script>
		
	</script>
	<!-- built files will be auto injected -->
</body>

</html>
